name: Compilar APK Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Criar Projeto Puro e Compilar
        run: |
          flutter create --org com.apitelecom --platforms=android meu_app
          cd meu_app
          flutter pub add flutter_inappwebview
          flutter build apk --debug

      - name: Enviar Arquivo para Download
        uses: actions/upload-artifact@v3
        with:
          name: app-api-telecom
          path: meu_app/build/app/outputs/flutter-apk/app-debug.apk
